[build]
# Build for the host CPU generation.
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "target-cpu=native",
  # Ensure ARM crypto + SIMD features are available to codegen.
  "-C", "target-feature=+sha2,+sha3,+aes,+neon",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", "target-cpu=native",
  "-C", "target-feature=+sha2,+sha3,+aes,+neon",
  # Faster linker when lld is available.
  "-C", "link-arg=-fuse-ld=lld",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "target-cpu=native",
  # Prefer modern fast linker on Linux.
  "-C", "link-arg=-fuse-ld=lld",
]
