[package]
name = "solana-vanity-wallet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solana_vanity"
path = "src/main.rs"

[dependencies]
# ring = BoringSSL assembly for aarch64:
#   - SHA-512 via sha512h/sha512h2/sha512su0/sha512su1 (FEAT_SHA512 hardware)
#   - Ed25519 basepoint multiply via NEON-vectorised field arithmetic
# Both are significantly faster than dalek's serial u64 backend + pure-Rust sha2.
ring = "0.17"
# ChaCha8Rng seeded from OS entropy once per thread; free-runs at ~4 GB/s.
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
# bs58 only called when a match is found (off the hot path).
bs58 = "0.5"

[profile.dev]
# Faster iteration for local debug builds.
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"          # whole-program inlining
codegen-units = 1
panic = "abort"
strip = true
incremental = false
