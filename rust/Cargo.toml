[package]
name = "solana-vanity-wallet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solana_vanity"
path = "src/main.rs"

[dependencies]
solana-sdk = "2"
bs58 = "0.5"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true